<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0a1e"/>
      <stop offset="50%" style="stop-color:#1a0a3c"/>
      <stop offset="100%" style="stop-color:#2d1b69"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="step1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="step2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    <linearGradient id="step3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="step4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient glows -->
  <circle cx="120" cy="315" r="280" fill="#8b5cf6" opacity="0.06"/>
  <circle cx="1080" cy="315" r="220" fill="#06b6d4" opacity="0.05"/>

  <!-- LEFT SIDE: Title block -->
  <!-- Badge -->
  <rect x="80" y="90" width="190" height="36" rx="18" fill="#8b5cf6" fill-opacity="0.25" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1"/>
  <text x="175" y="113" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#c4b5fd" text-anchor="middle" letter-spacing="1.5">GUIA COMPLETO</text>

  <!-- Main title -->
  <text x="80" y="180" font-family="system-ui,-apple-system,sans-serif" font-size="44" font-weight="900" fill="white" letter-spacing="-1">Qual é a Melhor</text>
  <text x="80" y="238" font-family="system-ui,-apple-system,sans-serif" font-size="44" font-weight="900" fill="white" letter-spacing="-1">Maneira de Usar</text>
  <text x="80" y="296" font-family="system-ui,-apple-system,sans-serif" font-size="44" font-weight="900" fill="#a78bfa" letter-spacing="-1">o UmbraHub?</text>

  <!-- Subtitle -->
  <text x="80" y="348" font-family="system-ui,sans-serif" font-size="18" fill="#94a3b8">O fluxo completo para extrair o máximo das 20+</text>
  <text x="80" y="372" font-family="system-ui,sans-serif" font-size="18" fill="#94a3b8">ferramentas e escalar sua produção com IA.</text>

  <!-- Meta tags -->
  <rect x="80" y="408" width="100" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.3"/>
  <text x="130" y="426" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#c4b5fd" text-anchor="middle">Tutorial</text>

  <rect x="192" y="408" width="110" height="28" rx="14" fill="#06b6d4" fill-opacity="0.2"/>
  <text x="247" y="426" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#67e8f9" text-anchor="middle">Produtividade</text>

  <rect x="314" y="408" width="80" height="28" rx="14" fill="#ec4899" fill-opacity="0.2"/>
  <text x="354" y="426" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#f9a8d4" text-anchor="middle">8 min</text>

  <!-- RIGHT SIDE: 4-step workflow -->
  <!-- Step 1 -->
  <rect x="560" y="80" width="160" height="105" rx="16" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="640" y="118" font-size="30" text-anchor="middle">🔍</text>
  <text x="640" y="148" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#c4b5fd" text-anchor="middle">PASSO 1</text>
  <text x="640" y="168" font-family="system-ui,sans-serif" font-size="12" fill="#a78bfa" text-anchor="middle">Pesquisa e Ideia</text>

  <!-- Arrow 1→2 -->
  <text x="738" y="138" font-size="22" fill="#475569" text-anchor="middle">→</text>

  <!-- Step 2 -->
  <rect x="760" y="80" width="160" height="105" rx="16" fill="#ec4899" fill-opacity="0.12" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="840" y="118" font-size="30" text-anchor="middle">✍️</text>
  <text x="840" y="148" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#f9a8d4" text-anchor="middle">PASSO 2</text>
  <text x="840" y="168" font-family="system-ui,sans-serif" font-size="12" fill="#f472b6" text-anchor="middle">Criar Roteiro</text>

  <!-- Arrow 2→3 (down) -->
  <text x="938" y="225" font-size="22" fill="#475569" text-anchor="middle" transform="rotate(90, 938, 225)">→</text>

  <!-- Step 3 -->
  <rect x="760" y="255" width="160" height="105" rx="16" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="840" y="293" font-size="30" text-anchor="middle">🎙️</text>
  <text x="840" y="323" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#67e8f9" text-anchor="middle">PASSO 3</text>
  <text x="840" y="343" font-family="system-ui,sans-serif" font-size="12" fill="#22d3ee" text-anchor="middle">Produção</text>

  <!-- Arrow 3→4 (left) -->
  <text x="738" y="313" font-size="22" fill="#475569" text-anchor="middle" transform="rotate(180, 738, 313)">→</text>

  <!-- Step 4 -->
  <rect x="560" y="255" width="160" height="105" rx="16" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="640" y="293" font-size="30" text-anchor="middle">📊</text>
  <text x="640" y="323" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#6ee7b7" text-anchor="middle">PASSO 4</text>
  <text x="640" y="343" font-family="system-ui,sans-serif" font-size="12" fill="#34d399" text-anchor="middle">Análise e Escala</text>

  <!-- Center logo between steps -->
  <circle cx="760" cy="208" r="30" fill="#1a0a3c" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="760" y="215" font-family="system-ui,sans-serif" font-size="15" font-weight="900" fill="#a78bfa" text-anchor="middle">U</text>

  <!-- Bottom stats row -->
  <rect x="560" y="390" width="370" height="70" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="650" y="420" font-family="system-ui,sans-serif" font-size="22" font-weight="900" fill="#8b5cf6" text-anchor="middle">20+</text>
  <text x="650" y="442" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Ferramentas</text>
  <line x1="715" y1="400" x2="715" y2="450" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="775" y="420" font-family="system-ui,sans-serif" font-size="22" font-weight="900" fill="#ec4899" text-anchor="middle">90%</text>
  <text x="775" y="442" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Menos tempo</text>
  <line x1="840" y1="400" x2="840" y2="450" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="900" y="420" font-family="system-ui,sans-serif" font-size="22" font-weight="900" fill="#10b981" text-anchor="middle">500+</text>
  <text x="900" y="442" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Criadores</text>

  <!-- Branding pill -->
  <rect x="960" y="560" width="160" height="44" rx="22" fill="url(#purple)"/>
  <text x="1040" y="587" font-family="system-ui,sans-serif" font-size="18" font-weight="900" fill="white" text-anchor="middle">UmbraHub</text>
</svg>
