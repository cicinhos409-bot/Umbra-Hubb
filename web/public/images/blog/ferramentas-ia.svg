<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0a1e"/>
      <stop offset="50%" style="stop-color:#1a0a3c"/>
      <stop offset="100%" style="stop-color:#2d1b69"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.06"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow elements -->
  <circle cx="150" cy="315" r="250" fill="#8b5cf6" opacity="0.08"/>
  <circle cx="1050" cy="315" r="200" fill="#ec4899" opacity="0.06"/>

  <!-- Tool icons grid (decorative) -->
  <rect x="820" y="100" width="70" height="70" rx="16" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>
  <text x="855" y="143" font-size="32" text-anchor="middle">⚡</text>

  <rect x="910" y="100" width="70" height="70" rx="16" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1"/>
  <text x="945" y="143" font-size="32" text-anchor="middle">🎙️</text>

  <rect x="1000" y="100" width="70" height="70" rx="16" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1"/>
  <text x="1035" y="143" font-size="32" text-anchor="middle">🖼️</text>

  <rect x="820" y="190" width="70" height="70" rx="16" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
  <text x="855" y="233" font-size="32" text-anchor="middle">📊</text>

  <rect x="910" y="190" width="70" height="70" rx="16" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
  <text x="945" y="233" font-size="32" text-anchor="middle">🔁</text>

  <rect x="1000" y="190" width="70" height="70" rx="16" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>
  <text x="1035" y="233" font-size="32" text-anchor="middle">🤖</text>

  <rect x="865" y="280" width="70" height="70" rx="16" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1"/>
  <text x="900" y="323" font-size="32" text-anchor="middle">✂️</text>

  <rect x="955" y="280" width="70" height="70" rx="16" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1"/>
  <text x="990" y="323" font-size="32" text-anchor="middle">🎯</text>

  <!-- Card -->
  <rect x="80" y="70" width="1040" height="490" rx="24" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <!-- Category badge -->
  <rect x="120" y="110" width="160" height="38" rx="19" fill="url(#purple)" opacity="0.9"/>
  <text x="200" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">IA · TOOLS</text>

  <!-- Number highlight -->
  <text x="120" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="180" font-weight="900" fill="#8b5cf6" opacity="0.12" letter-spacing="-10">10</text>

  <!-- Main emoji -->
  <text x="210" y="330" font-size="110" text-anchor="middle" filter="url(#glow)">🤖</text>

  <!-- Title -->
  <text x="400" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#a78bfa" font-weight="700">AS 10 MELHORES</text>
  <text x="400" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="white" letter-spacing="-1">Ferramentas de IA</text>
  <text x="400" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#a78bfa" letter-spacing="-1">para Criadores</text>

  <!-- Description -->
  <text x="400" y="388" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8">Ranking completo • Preços • Para quem é cada uma</text>

  <!-- Tags inline -->
  <rect x="400" y="418" width="80" height="30" rx="15" fill="#8b5cf6" fill-opacity="0.3"/>
  <text x="440" y="438" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#c4b5fd" text-anchor="middle">Gratuitas</text>

  <rect x="494" y="418" width="80" height="30" rx="15" fill="#ec4899" fill-opacity="0.25"/>
  <text x="534" y="438" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f9a8d4" text-anchor="middle">Pagas</text>

  <rect x="588" y="418" width="100" height="30" rx="15" fill="#06b6d4" fill-opacity="0.2"/>
  <text x="638" y="438" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#67e8f9" text-anchor="middle">IA Generativa</text>

  <!-- Read time -->
  <text x="400" y="490" font-family="system-ui, sans-serif" font-size="16" fill="#6d28d9" font-weight="600">⏱ 6 min de leitura</text>

  <!-- Branding -->
  <rect x="960" y="490" width="140" height="50" rx="12" fill="url(#purple)" opacity="0.9"/>
  <text x="1030" y="520" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="white" text-anchor="middle">UmbraHub</text>
</svg>
