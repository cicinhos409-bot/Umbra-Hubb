  <text x="820" y="320" font-family="system-ui,-apple-system,sans-serif" font-size="100" font-weight="900" fill="url(#money)" text-anchor="middle" filter="url(#glow)">R$5k</text>
  <text x="820" y="365" font-family="system-ui,sans-serif" font-size="22" fill="#6ee7b7" text-anchor="middle">/mês</text>

