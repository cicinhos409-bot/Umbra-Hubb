  <text x="120" y="278" font-family="system-ui,-apple-system,sans-serif" font-size="50" font-weight="900" fill="white" letter-spacing="-1">Como Ganhar</text>
  <text x="120" y="336" font-family="system-ui,-apple-system,sans-serif" font-size="50" font-weight="900" fill="url(#tiktok)" letter-spacing="-1">R$5.000/Mês</text>
