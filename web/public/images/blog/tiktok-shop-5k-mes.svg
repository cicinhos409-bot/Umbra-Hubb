  <text x="413" y="494" font-family="system-ui,sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Investimento</text>
  <text x="413" y="515" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#10b981" text-anchor="middle">R$0 inicial</text>

  <rect x="960" y="492" width="140" height="48" rx="10" fill="#ff2d55" opacity="0.9"/>
  <text x="1030" y="521" font-family="system-ui,sans-serif" font-size="18" font-weight="900" fill="white" text-anchor="middle">UmbraHub</text>
