  <text x="170" y="494" font-family="system-ui,sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Leitura</text>
  <text x="170" y="515" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#ff2d55" text-anchor="middle">12 min</text>

  <rect x="234" y="472" width="100" height="54" rx="10" fill="#ffffff" fill-opacity="0.05"/>
  <text x="284" y="494" font-family="system-ui,sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Nivel</text>
