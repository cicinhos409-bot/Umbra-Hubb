<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>Umbra</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      background: #0a0a0f;
      color: #f0f0f0;
      font-family: 'Syne', sans-serif;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(192,132,252,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(192,132,252,0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative; z-index: 1;
      padding: 24px 22px 20px;
      display: flex; flex-direction: column; gap: 16px;
      animation: fadeUp 0.35s ease;
    }

    .logo-row {
      display: flex; align-items: center; gap: 10px;
    }
    .logo-row img { width: 26px; height: 26px; }
    .logo-row .name { font-size: 15px; font-weight: 800; }
    .logo-row .name em { color: #c084fc; font-style: normal; }
    .logo-row .badge {
      margin-left: auto;
      font-family: 'Space Mono', monospace;
      font-size: 8px; letter-spacing: 2px;
      color: #c084fc;
      border: 1px solid rgba(192,132,252,0.35);
      padding: 2px 6px; border-radius: 3px;
    }

    .status-row {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px; padding: 10px 12px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #4ade80; box-shadow: 0 0 6px #4ade80;
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .status-txt { font-size: 12px; color: rgba(255,255,255,0.7); }
    .status-ver {
      margin-left: auto;
      font-family: 'Space Mono', monospace;
      font-size: 9px; color: rgba(255,255,255,0.2);
      letter-spacing: 0.5px;
    }

    .desc {
      font-size: 11.5px; color: rgba(255,255,255,0.36);
      line-height: 1.6; text-align: center;
    }

    .btn-open {
      width: 100%; padding: 12px;
      background: linear-gradient(135deg, #c084fc, #818cf8);
      color: #fff; font-family: 'Syne', sans-serif;
      font-size: 13px; font-weight: 700; letter-spacing: 0.4px;
      border: none; border-radius: 8px; cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-open:hover { opacity: 0.88; }
    .btn-open:active { transform: scale(0.97); }

    .footer {
      display: flex; justify-content: center;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 12px;
    }
    .footer a {
      font-family: 'Space Mono', monospace; font-size: 10px;
      color: rgba(255,255,255,0.2); text-decoration: none;
      transition: color 0.2s;
    }
    .footer a:hover { color: #c084fc; }

    @keyframes fadeUp { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo-row">
      <img src="icons/icon-32.png" alt="Umbra">
      <span class="name">Umbra <em>Studio</em></span>
      <span class="badge">v4.0.5</span>
    </div>

    <div class="status-row">
      <div class="dot"></div>
      <span class="status-txt">Extensão ativa</span>
      <span class="status-ver">UMBRA v4.0.5</span>
    </div>

    <p class="desc">O painel flutuante aparece automaticamente no YouTube e YouTube Studio.</p>

    <button class="btn-open" id="btn-open">ABRIR NO YOUTUBE STUDIO</button>

    <div class="footer">
      <a href="https://umbrahubb.vercel.app" target="_blank">umbrahubb.vercel.app</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
