<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umbra Hub | Arsenal para Canais Dark</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🌙</text></svg>">
  <script src="/coi-serviceworker.js" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&family=Bebas+Neue&family=Rajdhani:wght@300;400;600;700&family=Orbitron:wght@400;600;900&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: {
              deep: '#030308',
              mid: '#0a0a12',
              light: '#12121f',
            },
            brand: {
              cyan: '#00f5ff',
              purple: '#a855f7',
              pink: '#ec4899',
              green: '#10b981',
            }
          },
          fontFamily: {
            'space': ['"Space Mono"', 'monospace'],
            'bebas': ['"Bebas Neue"', 'sans-serif'],
            'rajdhani': ['Rajdhani', 'sans-serif'],
            'orbitron': ['Orbitron', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #030308;
      color: #f9fafb;
    }

    .bg-grid {
      background-size: 40px 40px;
      background-image: radial-gradient(circle, #ffffff05 1px, transparent 1px);
    }

    .neon-glow-purple {
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
    }

    .neon-glow-cyan {
      box-shadow: 0 0 20px rgba(0, 245, 255, 0.2);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(168, 85, 247, 0.2);
    }
  </style>

}
