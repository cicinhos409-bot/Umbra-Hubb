appId: com.umbrahub.app
productName: Umbra Hub
copyright: Copyright © 2026 Umbra Hub

protocols:
  - name: umbra-hub
    schemes:
      - umbra-hub

directories:
  output: release
  buildResources: electron

files:
  - dist/**/*
  - electron/**/*
  - package.json

extraResources:
  - from: dist-backend
    to: backend

win:
  icon: electron/icon.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "Umbra Hub Setup ${version}.exe"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Umbra Hub

publish: null
